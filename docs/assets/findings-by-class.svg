<?xml version="1.0" encoding="UTF-8"?>
<!--
  Palette reason: the subject is auditing weak randomness in security code.
  One neutral steel grey (#475569) carries the ordinary finding bars because
  every bar is a real count, not a mood. One accent, amber #b45309, marks the
  single tallest class so the eye lands first on the worst category. Amber is
  the conventional warning colour, which matches "look here". Neutrals (ink
  text, hairlines, panel) do not count toward the two-colour budget.

  Numbers: produced by running `python -m entropyaudit report samples` in this
  repository. Total 7 findings across 6 classes. Counts per class are printed
  in the "findings by class" block of that command's output.

  Motion: none. A static bar chart is the correct professional default.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" role="img"
     aria-labelledby="title desc" width="520" height="360">
  <title id="title">entropyaudit findings by class</title>
  <desc>Horizontal bar chart of findings from scanning the samples directory.
    Seven findings across six classes. Reusing a nonce or key pair has two
    findings; the other five classes have one each. Data captured by running
    the entropyaudit report command.</desc>

  <rect x="0" y="0" width="520" height="360" fill="#ffffff"/>

  <!-- Heading -->
  <text x="16" y="28"
        font-family="-apple-system, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif"
        font-size="16" font-weight="600" fill="#0f172a">Findings by class</text>
  <text x="16" y="46"
        font-family="-apple-system, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif"
        font-size="12" fill="#475569">Source: entropyaudit report samples. Total 7 findings.</text>

  <!-- Plot area. Bars start at x=248. Scale: each unit = 96px, max value 2. -->
  <!-- x axis gridline positions: 0 -> 248, 1 -> 344, 2 -> 440 -->

  <!-- Row 1: Reusing a nonce or key pair, count 2 (accent, the worst class) -->
  <text x="240" y="86" text-anchor="end"
        font-family="-apple-system, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif"
        font-size="12" fill="#0f172a">Nonce or key reuse</text>
  <rect x="248" y="74" width="192" height="20" rx="3" fill="#b45309"/>
  <text x="448" y="89"
        font-family="&quot;Cascadia Mono&quot;, &quot;JetBrains Mono&quot;, Consolas, &quot;DejaVu Sans Mono&quot;, monospace"
        font-size="12" fill="#0f172a">2</text>

  <!-- Row 2: Insufficiently random values, count 1 -->
  <text x="240" y="122" text-anchor="end"
        font-family="-apple-system, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif"
        font-size="12" fill="#0f172a">Insufficiently random values</text>
  <rect x="248" y="110" width="96" height="20" rx="3" fill="#475569"/>
  <text x="352" y="125"
        font-family="&quot;Cascadia Mono&quot;, &quot;JetBrains Mono&quot;, Consolas, &quot;DejaVu Sans Mono&quot;, monospace"
        font-size="12" fill="#0f172a">1</text>

  <!-- Row 3: Weak PRNG on security path, count 1 -->
  <text x="240" y="158" text-anchor="end"
        font-family="-apple-system, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif"
        font-size="12" fill="#0f172a">Weak PRNG on security path</text>
  <rect x="248" y="146" width="96" height="20" rx="3" fill="#475569"/>
  <text x="352" y="161"
        font-family="&quot;Cascadia Mono&quot;, &quot;JetBrains Mono&quot;, Consolas, &quot;DejaVu Sans Mono&quot;, monospace"
        font-size="12" fill="#0f172a">1</text>

  <!-- Row 4: Predictable seed in PRNG, count 1 -->
  <text x="240" y="194" text-anchor="end"
        font-family="-apple-system, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif"
        font-size="12" fill="#0f172a">Predictable seed in PRNG</text>
  <rect x="248" y="182" width="96" height="20" rx="3" fill="#475569"/>
  <text x="352" y="197"
        font-family="&quot;Cascadia Mono&quot;, &quot;JetBrains Mono&quot;, Consolas, &quot;DejaVu Sans Mono&quot;, monospace"
        font-size="12" fill="#0f172a">1</text>

  <!-- Row 5: Predictable salt, count 1 -->
  <text x="240" y="230" text-anchor="end"
        font-family="-apple-system, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif"
        font-size="12" fill="#0f172a">Predictable salt</text>
  <rect x="248" y="218" width="96" height="20" rx="3" fill="#475569"/>
  <text x="352" y="233"
        font-family="&quot;Cascadia Mono&quot;, &quot;JetBrains Mono&quot;, Consolas, &quot;DejaVu Sans Mono&quot;, monospace"
        font-size="12" fill="#0f172a">1</text>

  <!-- Row 6: Weak password hash, count 1 -->
  <text x="240" y="266" text-anchor="end"
        font-family="-apple-system, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif"
        font-size="12" fill="#0f172a">Weak password hash</text>
  <rect x="248" y="254" width="96" height="20" rx="3" fill="#475569"/>
  <text x="352" y="269"
        font-family="&quot;Cascadia Mono&quot;, &quot;JetBrains Mono&quot;, Consolas, &quot;DejaVu Sans Mono&quot;, monospace"
        font-size="12" fill="#0f172a">1</text>

  <!-- X axis line and ticks -->
  <line x1="248" y1="288" x2="440" y2="288" stroke="#94a3b8" stroke-width="1"/>
  <line x1="248" y1="288" x2="248" y2="294" stroke="#94a3b8" stroke-width="1"/>
  <line x1="344" y1="288" x2="344" y2="294" stroke="#94a3b8" stroke-width="1"/>
  <line x1="440" y1="288" x2="440" y2="294" stroke="#94a3b8" stroke-width="1"/>
  <text x="248" y="308" text-anchor="middle"
        font-family="&quot;Cascadia Mono&quot;, &quot;JetBrains Mono&quot;, Consolas, &quot;DejaVu Sans Mono&quot;, monospace"
        font-size="11" fill="#475569">0</text>
  <text x="344" y="308" text-anchor="middle"
        font-family="&quot;Cascadia Mono&quot;, &quot;JetBrains Mono&quot;, Consolas, &quot;DejaVu Sans Mono&quot;, monospace"
        font-size="11" fill="#475569">1</text>
  <text x="440" y="308" text-anchor="middle"
        font-family="&quot;Cascadia Mono&quot;, &quot;JetBrains Mono&quot;, Consolas, &quot;DejaVu Sans Mono&quot;, monospace"
        font-size="11" fill="#475569">2</text>
  <text x="344" y="332" text-anchor="middle"
        font-family="-apple-system, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif"
        font-size="12" fill="#0f172a">findings per class (count)</text>
</svg>

