<?xml version="1.0" encoding="UTF-8"?>
<!--
  Palette reason: the subject is auditing weak randomness in security code.
  One neutral steel grey (#475569) carries the ordinary finding bars because
  every bar is a real count, not a mood. One accent, amber #b45309, marks the
  single tallest class so the eye lands first on the worst category. Amber is
  the conventional warning colour, which matches "look here". Neutrals (ink
  text, hairlines, panel) do not count toward the two-colour budget.

  Numbers: produced by running `python -m entropyaudit report samples` in this
  repository. Total 7 findings across 6 classes. Counts per class are printed
  in the "findings by class" block of that command's output.

  Motion: none. A static bar chart is the correct professional default.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" role="img"
     aria-labelledby="title desc" width="520" height="360">
  <title id="title">entropyaudit findings by class</title>
  <desc>Horizontal bar chart of findings from scanning the samples directory.
    Seven findings across six classes. Reusing a nonce or key pair has two
    findings; the other five classes have one each. Data captured by running
    the entropyaudit report command.</desc>

  <rect x="0" y="0" width="520" height="360" fill="#ffffff"/>

  <!-- Heading -->
  <text x="16" y="28"
        font-family="-apple-system, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif"
        font-size="16" font-weight="600" fill="#0f172a">Findings by class</text>
  <text x="16" y="46"
        font-family="-apple-system, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif"
        font-size="12" fill="#475569">Source: entropyaudit report samples. Total 7 findings.</text>

  <!-- Plot area. Bars start at x=248. Scale: each unit = 96px, max value 2. -->
  <!-- x axis gridline positions: 0 -> 248, 1 -> 344, 2 -> 440 -->
