<?xml version="1.0" encoding="UTF-8"?>
<!--
  Palette reason: same family as the diagram. The wordmark splits the compound
  name at its morpheme boundary: "entropy" in neutral ink #0f172a, "audit" in
  the amber accent #b45309 that the diagram uses to mark the class needing
  attention. The split says the tool reads entropy and reports on it. One
  accent, one ink, no third colour. No mark is added because the tool's core
  data structure is a list of findings, which a wordmark represents honestly
  without inventing geometry.

  Motion: none.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 96" role="img"
     aria-labelledby="title desc" width="240" height="96">
  <title id="title">entropyaudit logo</title>
  <desc>Wordmark reading entropyaudit, with "entropy" in dark ink and "audit"
    in amber, split at the compound word boundary.</desc>

  <rect x="0" y="0" width="240" height="96" fill="#ffffff"/>

  <text x="16" y="56"
        font-family="&quot;Cascadia Mono&quot;, &quot;JetBrains Mono&quot;, Consolas, &quot;DejaVu Sans Mono&quot;, monospace"
        font-size="26" font-weight="600" fill="#0f172a">entropy<tspan fill="#b45309">audit</tspan></text>
  <text x="16" y="78"
        font-family="-apple-system, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif"
        font-size="12" fill="#475569">randomness and nonce hygiene, static</text>
</svg>

